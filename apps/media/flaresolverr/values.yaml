app-template:
  defaultPodOptions:
    securityContext:
      runAsUser: 1000
  controllers:
    main:
      containers:
        flaresolverr:
          image: { repository: ghcr.io/flaresolverr/flaresolverr, tag: v3.5.2 }
  service:
    main:
      controller: main
      ports:
        flaresolverr:
          port: 8191
          protocol: TCP
  ingress:
    main:
      hosts:
        - host: &flaresolverrHost flaresolverr.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: flaresolverr
      tls:
        - secretName: flaresolverr-tls-certificate
          hosts:
            - *flaresolverrHost
  persistence:
    config:
      advancedMounts:
        main:
          flaresolverr:
            - path: /config
              subPath: flaresolverr
