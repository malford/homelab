app-template:
  # Overrides the shared block in apps/media/_shared/base.yaml: this image runs
  # as 1000, not the 1029 that owns the media volumes. Restated in full because
  # it is the whole block that differs, not one key.
  defaultPodOptions:
    enableServiceLinks: true
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
      fsGroup: 100
  controllers:
    main:
      containers:
        flaresolverr:
          image: { repository: ghcr.io/flaresolverr/flaresolverr, tag: v3.4.4 }
  service:
    main:
      controller: main
      ports:
        flaresolverr:
          port: 8191
          protocol: TCP
  ingress:
    main:
      hosts:
        - host: &flaresolverrHost flaresolverr.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: flaresolverr
      tls:
        - secretName: flaresolverr-tls-certificate
          hosts:
            - *flaresolverrHost
  persistence:
    config:
      advancedMounts:
        main:
          flaresolverr:
            - path: /config
              subPath: flaresolverr
