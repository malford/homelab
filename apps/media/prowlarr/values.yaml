app-template:
  controllers:
    main:
      containers:
        prowlarr:
          image: { repository: lscr.io/linuxserver/prowlarr, tag: 2.3.5 }
          securityContext:
            runAsUser: 0
          env:
            PUID: 1029
            PGID: 100
            UMASK: 002
  service:
    main:
      controller: main
      ports:
        prowlarr:
          port: 9696
          protocol: HTTP
  ingress:
    main:
      hosts:
        - host: &prowlarrHost prowlarr.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: prowlarr
      tls:
        - secretName: prowlarr-tls-certificate
          hosts:
            - *prowlarrHost
  persistence:
    config:
      advancedMounts:
        main:
          prowlarr:
            - path: /config
              subPath: prowlarr
