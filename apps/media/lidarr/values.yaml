app-template:
  controllers:
    main:
      containers:
        lidarr:
          image: { repository: docker.io/linuxserver/lidarr, tag: latest }
          securityContext:
            runAsUser: 0
          env:
            PUID: 1029
            PGID: 100
            UMASK: 002
  service:
    main:
      controller: main
      ports:
        lidarr:
          port: 8686
          protocol: HTTP
  ingress:
    main:
      hosts:
        - host: &lidarrHost lidarr.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: lidarr
      tls:
        - secretName: lidarr-tls-certificate
          hosts:
            - *lidarrHost
  persistence:
    media:
      type: persistentVolumeClaim
      existingClaim: jellyfin-media
      globalMounts:
        - path: /media
    config:
      advancedMounts:
        main:
          lidarr:
            - path: /config
              subPath: lidarr
    downloads:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: downloads-shared
      advancedMounts:
        main:
          lidarr:
            - path: /downloads
