app-template:
  controllers:
    main:
      containers:
        sabnzbd:
          image: { repository: docker.io/linuxserver/sabnzbd, tag: 5.1.3 }
          securityContext:
            runAsUser: 0
          env:
            PUID: 1029
            PGID: 100
            UMASK: 002
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
  service:
    main:
      controller: main
      ports:
        sabnzbd:
          port: 8080
          protocol: HTTP
  ingress:
    main:
      hosts:
        - host: &sabnzbdHost sabnzbd.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: sabnzbd
      tls:
        - secretName: sabnzbd-tls-certificate
          hosts:
            - *sabnzbdHost
  persistence:
    media:
      type: persistentVolumeClaim
      existingClaim: jellyfin-media
      globalMounts:
        - path: /media
    config:
      advancedMounts:
        main:
          sabnzbd:
            - path: /config
              subPath: sabnzbd
    downloads:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: downloads-shared
      advancedMounts:
        main:
          sabnzbd:
            - path: /downloads
            - path: /incomplete-downloads
              subPath: incomplete
