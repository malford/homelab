{{/*
The media library on the NAS, mounted ReadWriteMany by plex, sabnzbd, lidarr,
radarr, sonarr and transmission. It lived in the jellyfin chart until jellyfin
was removed; the name is kept because renaming a bound claim means recreating it
and remounting it in all six.

Prune=false,Delete=false: the PV is Retain, so the NAS data survives regardless,
but losing the claim breaks every consumer on its next restart. Same reasoning as
the downloads-shared PVC alongside this file.
*/}}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - soft
    - timeo=50
    - retrans=3
    - nfsvers=3
    - rsize=131072
    - wsize=131072
    - noatime
    - nolock

  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-media-pv
    volumeAttributes:
      server: 192.168.3.20
      share: /volume1/media

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  volumeName: jellyfin-media-pv
