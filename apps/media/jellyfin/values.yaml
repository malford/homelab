app-template:
  controllers:
    main:
      containers:
        jellyfin:
          image: { repository: docker.io/jellyfin/jellyfin, tag: 10.8.13 }
          securityContext:
            runAsUser: 0
          env:
            PUID: 1029
            PGID: 100
            UMASK: 002
  service:
    main:
      controller: main
      ports:
        http:
          port: 8096
          protocol: HTTP
  ingress:
    main:
      hosts:
        - host: &jellyfinHost jellyfin.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - secretName: jellyfin-tls-certificate
          hosts:
            - *jellyfinHost
  persistence:
    media:
      type: persistentVolumeClaim
      existingClaim: jellyfin-media
      globalMounts:
        - path: /media
    config:
      advancedMounts:
        main:
          jellyfin:
            - path: /config
              subPath: jellyfin
