app-template:
  defaultPodOptions:
    securityContext:
      runAsUser: 102
  controllers:
    main:
      containers:
        plex:
          image: { repository: docker.io/plexinc/pms-docker, tag: 1.43.7.11114-4b588ea35 }
          securityContext:
            runAsUser: 0
            privileged: true
          env:
            ADVERTISE_IP: "http://192.168.5.230:32400/"
            ALLOWED_NETWORKS: 192.168.0.0/16,10.0.0.0/8
            HOSTNAME: "plex.malford.io"
            PLEX_GID: 100
            PLEX_UID: 1027
            TRANSCODE_DIR: /transcode
            TZ: "America/New_York"
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 8000m
              memory: 12Gi
  service:
    main:
      controller: main
      type: LoadBalancer
      externalTrafficPolicy: Local
      loadBalancerIP: 192.168.5.230
      ports:
        plex:
          port: 32400
          protocol: TCP
  ingress:
    main:
      hosts:
        - host: &plexHost plex.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: plex
      tls:
        - secretName: plex-tls-certificate
          hosts:
            - *plexHost
  persistence:
    transcode:
      enabled: true
      type: emptyDir
      medium: Memory
      advancedMounts:
        main:
          plex:
            - path: /transcode
    dri:
      enabled: true
      type: hostPath
      hostPath: /dev/dri
      advancedMounts:
        main:
          plex:
            - path: /dev/dri
    media:
      type: persistentVolumeClaim
      existingClaim: jellyfin-media
      globalMounts:
        - path: /media
    config:
      advancedMounts:
        main:
          plex:
            - path: /config
              subPath: plex
