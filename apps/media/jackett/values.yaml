app-template:
  controllers:
    main:
      containers:
        jackett:
          image: { repository: docker.io/linuxserver/jackett, tag: 0.24.252 }
          securityContext:
            runAsUser: 0
          env:
            PUID: 1029
            PGID: 100
            UMASK: 002
  service:
    main:
      controller: main
      ports:
        jackett:
          port: 9117
          protocol: HTTP
  ingress:
    main:
      hosts:
        - host: &jackettHost jackett.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: jackett
      tls:
        - secretName: jackett-tls-certificate
          hosts:
            - *jackettHost
  persistence:
    config:
      advancedMounts:
        main:
          jackett:
            - path: /config
              subPath: Jackett
