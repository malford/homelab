app-template:
  controllers:
    main:
      containers:
        jellyseerr:
          image: { repository: docker.io/fallenbagel/jellyseerr, tag: 2.7.3 }
          env:
            PUID: 1029
            PGID: 100
            UMASK: 002
  service:
    main:
      controller: main
      ports:
        jellyseerr:
          port: 5055
          protocol: HTTP
  ingress:
    main:
      hosts:
        - host: &jellyseerrHost jellyseerr.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: jellyseerr
      tls:
        - secretName: jellyseerr-tls-certificate
          hosts:
            - *jellyseerrHost
  persistence:
    config:
      advancedMounts:
        main:
          jellyseerr:
            - path: /app/config
              subPath: jellyseerr
