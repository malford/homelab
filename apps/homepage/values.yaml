app-template:
  defaultPodOptions:
    automountServiceAccountToken: true
  controllers:
    homepage:
      containers:
        app:
          image:
            repository: ghcr.io/gethomepage/homepage
            tag: v2.6.0
          env:
            HOMEPAGE_ALLOWED_HOSTS: "*"
          envFrom:
            - secret: homepage-secret
  service:
    app:
      controller: homepage
      ports:
        http:
          port: 3000
  ingress:
    nginx:
      forceRename: homepage-nginx
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: &host home.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: app
                port: http
      tls:
        - hosts:
            - *host
          secretName: homepage-tls-certificate
  persistence:
    config:
      type: configMap
      identifier: config
      globalMounts:
        - path: /app/config/settings.yaml
          subPath: settings.yaml
        - path: /app/config/widgets.yaml
          subPath: widgets.yaml
        - path: /app/config/services.yaml
          subPath: services.yaml
        - path: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - path: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
  configMaps:
    config:
      data:
        settings.yaml: |
          title: Malford Homelab
          theme: dark
          color: slate
          headerStyle: clean
          cardBlur: sm
          # Pod health shows as a coloured dot instead of a text pill.
          statusStyle: dot
          showStats: true
          useEqualHeights: true
          hideVersion: false
          maxGroupColumns: 4
          maxBookmarkGroupColumns: 4
          quicklaunch:
            searchDescriptions: true
            showSearchSuggestions: true
            hideInternetSearch: false
          # List form keeps tab and group ordering deterministic.
          layout:
            - Essentials:
                tab: Home
                style: row
                columns: 4
            - Utilities:
                tab: Home
                style: row
                columns: 4
            - Streaming:
                tab: Media
                style: row
                columns: 2
            - Library:
                tab: Media
                style: row
                columns: 3
            - Downloads:
                tab: Media
                style: row
                columns: 4
            - Platform:
                tab: Infra
                style: row
                columns: 4
            - Observability:
                tab: Infra
                style: row
                columns: 3
            - Identity:
                tab: Infra
                style: row
                columns: 2
        widgets.yaml: |
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
                showLabel: true
                label: "cluster"
              nodes:
                show: true
                cpu: true
                memory: true
                showLabel: true
          - openmeteo:
              label: Brooklyn
              latitude: 40.6459048
              longitude: -73.9738999
              units: imperial
              cache: 5
          - datetime:
              text_size: xl
              format:
                dateStyle: medium
                timeStyle: short
                hourCycle: h23
          - search:
              provider: duckduckgo
              target: _blank
        kubernetes.yaml: |
          mode: cluster
        services.yaml: |
          - Essentials:
            - Home Assistant:
                href: https://ha.malford.io
                description: Home automation
                icon: home-assistant.svg
                namespace: home-assistant
                app: home-assistant
            - Paperless:
                href: https://paperless.malford.io
                description: Document management
                icon: paperless.svg
                namespace: paperless
                app: paperless
                widget:
                  type: paperlessngx
                  url: http://paperless.paperless.svc.cluster.local:8000
                  key: '{{ `{{HOMEPAGE_VAR_PAPERLESS_API_KEY}}` }}'
                  fields: ["total", "inbox"]
            - Actual Budget:
                href: https://budget.malford.io
                description: Personal finance
                icon: actual-budget.svg
                namespace: actualbudget
                app: actualbudget
            - PairDrop:
                href: https://drop.malford.io
                description: Local file transfer
                icon: pairdrop.svg
                namespace: pairdrop
                app: pairdrop
          - Utilities:
            - Chatbot:
                href: https://ai.malford.io
                description: Ollama agentic chatbot
                icon: ollama-dark.svg
                namespace: ollama
                app: ollama
            - Excalidraw:
                href: https://draw.malford.io
                description: Virtual whiteboard
                icon: excalidraw.svg
                namespace: excalidraw
                app: excalidraw
            - Speedtest:
                href: https://speedtest.malford.io
                description: Internal network speed test
                icon: openspeedtest.png
                namespace: speedtest
                app: speedtest
            - Network Optimizer:
                href: https://network-optimizer.malford.io
                description: WAN tuning and diagnostics
                icon: mdi-speedometer-#38bdf8
                namespace: network-optimizer
                app: network-optimizer
          - Streaming:
            - Plex:
                href: https://plex.malford.io
                description: Media streaming
                icon: plex.svg
                namespace: media
                app: plex
                widget:
                  type: plex
                  url: http://plex.media.svc.cluster.local:32400
                  key: '{{ `{{HOMEPAGE_VAR_PLEX_TOKEN}}` }}'
            - Seerr:
                href: https://seerr.malford.io
                description: Media requests
                icon: seerr.svg
                namespace: media
                app: seerr
          - Library:
            - Radarr:
                href: https://radarr.malford.io
                description: Movie library manager
                icon: radarr.svg
                namespace: media
                app: radarr
                widget:
                  type: radarr
                  # Kestrel AllowedHosts on the PVC rejects *.svc.cluster.local.
                  url: https://radarr.malford.io
                  key: '{{ `{{HOMEPAGE_VAR_RADARR_API_KEY}}` }}'
                  enableQueue: true
                  fields: ["wanted", "missing", "queued"]
            - Sonarr:
                href: https://sonarr.malford.io
                description: TV library manager
                icon: sonarr.svg
                namespace: media
                app: sonarr
                widget:
                  type: sonarr
                  # Same AllowedHosts restriction as Radarr.
                  url: https://sonarr.malford.io
                  key: '{{ `{{HOMEPAGE_VAR_SONARR_API_KEY}}` }}'
                  enableQueue: true
                  fields: ["wanted", "queued", "series"]
            - Lidarr:
                href: https://lidarr.malford.io
                description: Music library manager
                icon: lidarr.svg
                namespace: media
                app: lidarr
                widget:
                  type: lidarr
                  url: http://lidarr.media.svc.cluster.local:8686
                  key: '{{ `{{HOMEPAGE_VAR_LIDARR_API_KEY}}` }}'
                  fields: ["wanted", "queued", "artists"]
          - Downloads:
            - SABnzbd:
                href: https://sabnzbd.malford.io
                description: Usenet client
                icon: sabnzbd.svg
                namespace: media
                app: sabnzbd
                widget:
                  type: sabnzbd
                  url: http://sabnzbd.media.svc.cluster.local:8080
                  key: '{{ `{{HOMEPAGE_VAR_SABNZBD_API_KEY}}` }}'
            - Transmission:
                href: https://transmission.malford.io
                description: Bittorrent client
                icon: transmission.svg
                namespace: media
                app: transmission
                widget:
                  type: transmission
                  url: http://transmission.media.svc.cluster.local:9091
            - Prowlarr:
                href: https://prowlarr.malford.io
                description: Indexer manager
                icon: prowlarr.svg
                namespace: media
                app: prowlarr
                widget:
                  type: prowlarr
                  url: http://prowlarr.media.svc.cluster.local:9696
                  key: '{{ `{{HOMEPAGE_VAR_PROWLARR_API_KEY}}` }}'
                  fields: ["numberOfGrabs", "numberOfQueries", "numberOfFailGrabs"]
            - Jackett:
                href: https://jackett.malford.io
                description: Torrent indexer proxy
                icon: jackett.svg
                namespace: media
                app: jackett
            - FlareSolverr:
                href: https://flaresolverr.malford.io
                description: Cloudflare challenge solver
                icon: flaresolverr.svg
                namespace: media
                app: flaresolverr
          - Platform:
            - ArgoCD:
                href: https://argocd.malford.io
                description: GitOps continuous deployment
                icon: argo-cd.svg
                namespace: argocd
                app: argocd-server
            - Gitea:
                href: https://git.malford.io
                description: Git forge
                icon: gitea.svg
                namespace: gitea
                app: gitea
            - Woodpecker:
                href: https://ci.malford.io
                description: Continuous integration
                icon: woodpecker-ci.svg
                namespace: woodpecker
                app: server
            - Registry:
                href: https://registry.malford.io
                description: Container registry
                icon: docker.svg
                namespace: zot
                app: zot
          - Observability:
            - Grafana:
                href: https://grafana.malford.io
                description: Dashboards and alerts
                icon: grafana.svg
                namespace: grafana
                app: grafana
                widget:
                  type: grafana
                  url: http://grafana.grafana.svc.cluster.local
                  # /api/admin/stats needs server admin, which anonymous auth
                  # can never grant, so basic auth is required.
                  username: admin
                  password: '{{ `{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}` }}'
                  # v2 counts alerts from the unified alerting API; alerts live
                  # in kube-prometheus-stack's Alertmanager, not Grafana's.
                  version: 2
                  alerts: alertmanager
                  fields: ["dashboards", "datasources", "alertstriggered"]
            - Prometheus:
                description: Metrics and scrape targets
                icon: prometheus.svg
                namespace: monitoring-system
                app: prometheus
                widget:
                  type: prometheus
                  url: http://monitoring-system-kube-pro-prometheus.monitoring-system.svc.cluster.local:9090
                  fields: ["targets_up", "targets_down", "targets_total"]
            - Unifi:
                href: https://unifi.local.mmalford.com
                description: Network controller
                icon: ubiquiti.svg
                widget:
                  type: unifi
                  url: https://192.168.3.1
                  username: '{{ `{{HOMEPAGE_VAR_UNIFI_USERNAME}}` }}'
                  password: '{{ `{{HOMEPAGE_VAR_UNIFI_PASSWORD}}` }}'
          - Identity:
            - Kanidm:
                href: https://auth.malford.io
                description: Identity provider
                icon: https://auth.malford.io/pkg/img/logo-square.svg
                namespace: kanidm
                app: kanidm
            - Dex:
                href: https://dex.malford.io
                description: OIDC connector for cluster SSO
                icon: mdi-shield-key-#f59e0b
                namespace: dex
                app: dex
        bookmarks.yaml: |
          - Homelab:
            - Homelab repository:
              - href: https://github.com/malford/homelab
                icon: github.svg
            - Gitea mirror:
              - href: https://git.malford.io
                icon: gitea.svg
          - Managed services:
            - Cloudflare:
              - href: https://dash.cloudflare.com
                icon: cloudflare.svg
            - Terraform Cloud:
              - href: https://app.terraform.io
                icon: terraform.svg
            - Google Cloud:
              - href: https://console.cloud.google.com
                icon: google-cloud-platform.svg
          - Infrastructure:
            - Router:
              - href: https://unifi.local.mmalford.com/
                icon: ubiquiti.svg
            - Tailscale:
              - href: https://login.tailscale.com/admin/machines
                icon: tailscale.svg
