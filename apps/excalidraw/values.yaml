app-template:
  controllers:
    excalidraw:
      containers:
        app:
          image:
            repository: docker.io/excalidraw/excalidraw
            # No version tags upstream; digest-pinned by hand, Renovate can't bump.
            tag: latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
  service:
    app:
      controller: excalidraw
      ports:
        http:
          port: 80
  ingress:
    app:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/target: homelab-tunnel.malford.io
        external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
      hosts:
        - host: &host draw.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: app
                port: http
      tls:
        - hosts:
            - *host
          secretName: excalidraw-tls-certificate
