apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-encryption
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  data:
    # Must be 64 hex chars; a non-hex value crash-loops the container and
    # changing it later orphans every stored integration credential.
    - secretKey: db-encryption-key
      remoteRef:
        key: external
        property: homarr-encryption-key
