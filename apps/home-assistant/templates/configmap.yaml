apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: {{ .Release.Namespace }}
data:
  # Seed only: copied to the PVC when configuration.yaml is absent. Home
  # Assistant owns the file after that, so editing this does not change a
  # running instance.
  # use_x_forwarded_for + trusted_proxies are mandatory behind the nginx
  # ingress - without them every proxied request returns 400 Bad Request.
  configuration.yaml: |
    default_config:

    frontend:
      themes: !include_dir_merge_named themes

    logger:
      default: info
      logs:
        # Upstream aioamazondevices#1049; cached values are still used.
        aioamazondevices: error
        # No BT-dependent integration and the adapter entry is disabled.
        habluetooth.manager: critical

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        # Cilium IPAM hands out 10.0.x.x, not the 10.42.x.x in node.spec.podCIDR.
        - 10.0.0.0/8
        - 192.168.5.0/24
