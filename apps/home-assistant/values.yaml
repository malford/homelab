app-template:
  defaultPodOptions:
    # Host networking puts mDNS/SSDP on the cluster VLAN only (192.168.5.0/24);
    # reaching clients and IoT on other VLANs needs the gateway mDNS proxy.
    # Pinned to two nodes so the address devices call back on stays predictable.
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
    terminationGracePeriodSeconds: 60
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - metal0v2
                    - metal1v2

  controllers:
    home-assistant:
      # hostNetwork + RWO: a second pod cannot start alongside the first.
      strategy: Recreate
      initContainers:
        init-config:
          image:
            repository: docker.io/library/alpine
            tag: "3.24.2"
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/configuration.yaml ]; then
                cp /tmp/seed/configuration.yaml /config/configuration.yaml
              fi
              for f in automations scripts scenes; do
                [ -f "/config/$f.yaml" ] || echo '[]' > "/config/$f.yaml"
              done
        # Declarative HACS install; replaces upstream's `wget | bash`, which needs
        # unzip that the HA image lacks. See docs/how-to-guides/home-assistant.md.
        init-hacs:
          dependsOn: init-config
          image:
            repository: docker.io/library/alpine
            tag: "3.24.2"
          env:
            # Source of truth: a UI self-update is reverted on the next pod start.
            HACS_VERSION: "2.0.5"
          command:
            - sh
            - -c
            - |
              set -eu
              target=/config/custom_components/hacs
              if [ "$(cat "$target/.hacs-chart-version" 2>/dev/null || true)" = "$HACS_VERSION" ]; then
                echo "HACS $HACS_VERSION already installed"
                exit 0
              fi
              echo "installing HACS $HACS_VERSION"
              # Staged on the PVC: same-filesystem rename, and a failed download
              # leaves the working install untouched.
              stage=/config/custom_components/.hacs-stage
              mkdir -p /config/custom_components
              rm -rf "$stage"
              mkdir -p "$stage"
              wget -qO /tmp/hacs.zip \
                "https://github.com/hacs/integration/releases/download/$HACS_VERSION/hacs.zip"
              # Archive is flat, so it unpacks into hacs/, not above it.
              unzip -q /tmp/hacs.zip -d "$stage"
              echo "$HACS_VERSION" > "$stage/.hacs-chart-version"
              rm -rf "$target"
              mv "$stage" "$target"
              echo "HACS $HACS_VERSION installed"
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: "2026.9.3"
          env:
            TZ: "America/New_York"
          probes:
            # HA needs 60-90s on a cold start; the startup probe holds the pod
            # NotReady until then so the ingress does not 502 through a restart.
            startup:
              enabled: true
              spec:
                failureThreshold: 60
                periodSeconds: 5
            readiness:
              enabled: true
            liveness:
              enabled: true

  service:
    app:
      controller: home-assistant
      ports:
        http:
          port: 8123

  ingress:
    app:
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: &host ha.malford.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: app
                port: http
      tls:
        - hosts:
            - *host
          secretName: home-assistant-tls-certificate

  persistence:
    data:
      type: persistentVolumeClaim
      storageClass: standard-rwo
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        home-assistant:
          main:
            - path: /config
          init-config:
            - path: /config
          init-hacs:
            - path: /config
    seed:
      type: configMap
      name: home-assistant-config
      advancedMounts:
        home-assistant:
          init-config:
            - path: /tmp/seed
