apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  data:
    - secretKey: APP_PASSWORD
      remoteRef:
        key: external
        property: network-optimizer-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-influxdb
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  data:
    - secretKey: DOCKER_INFLUXDB_INIT_PASSWORD
      remoteRef:
        key: influxdb.admin
        property: password
    - secretKey: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
      remoteRef:
        key: influxdb.admin
        property: admin_token
