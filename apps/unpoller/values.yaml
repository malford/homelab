app-template:
  controllers:
    unpoller:
      containers:
        app:
          image:
            repository: ghcr.io/unpoller/unpoller
            tag: v5.2.7
          env:
            # Nothing writes to the NAS InfluxDB after this, which is what
            # makes the phase 2 teardown clean.
            UP_INFLUXDB_DISABLE: "true"
            UP_PROMETHEUS_DISABLE: "false"
            UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
            # UnifiOS proxies the controller on 443 - no :8443 here.
            UP_UNIFI_DEFAULT_URL: https://192.168.3.1
            UP_UNIFI_DEFAULT_VERIFY_SSL: "false"
            UP_UNIFI_DEFAULT_SAVE_DPI: "true"
            UP_UNIFI_DEFAULT_SAVE_SITES: "true"
          envFrom:
            - secret: unpoller-secret
          probes:
            liveness: &probe
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 9130
            readiness: *probe
  service:
    app:
      controller: unpoller
      ports:
        http:
          port: 9130
  serviceMonitor:
    app:
      service:
        identifier: app
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s
