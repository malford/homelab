app-template:
  controllers:
    openclaw:
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      initContainers:
        init-config:
          image:
            repository: docker.io/library/alpine
            tag: "3.24.3"
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              if [ ! -f /home/node/.openclaw/openclaw.json ]; then
                cp /tmp/openclaw-config/openclaw.json /home/node/.openclaw/openclaw.json
              fi &&
              chmod 600 /home/node/.openclaw/openclaw.json &&
              chmod 700 /home/node/.openclaw &&
              chown -R 1000:1000 /home/node/.openclaw
      containers:
        main:
          image:
            repository: ghcr.io/openclaw/openclaw
            tag: "2026.10.9"
          env:
            TZ: "America/New_York"
            OPENCLAW_GATEWAY_PORT: "18789"
            NODE_ENV: "production"
          envFrom:
            - secretRef:
                name: openclaw-secret

  service:
    openclaw:
      controller: openclaw
      ports:
        http:
          port: 18789
          protocol: HTTP

  ingress:
    # Publishes the gateway onto the tailnet, bypassing nginx. The operator
    # creates its own device and terminates TLS via MagicDNS, so no cert-manager
    # here. Reachable at https:// and wss://openclaw-gateway.tail811db.ts.net
    # - the hostname comes from tls.hosts, which configmap.yaml also pins in
    # gateway.controlUi.allowedOrigins.
    tailscale:
      # Pinned: this is openclaw's only ingress, so app-template would otherwise
      # name it `openclaw` and the rename would make the operator rebuild the
      # tailnet device - risking an `openclaw-gateway-1` hostname.
      forceRename: openclaw-tailscale
      className: tailscale
      hosts:
        - host: openclaw-gateway
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: openclaw
                port: http
      tls:
        - hosts:
            - openclaw-gateway

  persistence:
    data:
      accessMode: ReadWriteOnce
      size: 5Gi
      advancedMounts:
        openclaw:
          main:
            - path: /home/node/.openclaw
          init-config:
            - path: /home/node/.openclaw
    configmap:
      type: configMap
      name: openclaw-config
      advancedMounts:
        openclaw:
          init-config:
            - path: /tmp/openclaw-config
