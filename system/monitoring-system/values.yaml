kube-prometheus-stack:
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.loki:3100
  prometheus-node-exporter:
    # mountstats is off by default; it exposes per-mount NFS read/write bytes,
    # which is the only way to see the Plex media PVC's throughput - the mount
    # belongs to the node, so pod network metrics never include it.
    # Overriding extraArgs replaces the chart's list rather than merging into
    # it, so the two filesystem excludes it ships with (as of 92.16.1) are
    # redeclared here. Re-diff them against `helm show values` on chart upgrades.
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - --collector.mountstats
  # k3s runs the control plane as one binary and exposes no separate metrics
  # endpoints for these three, so the stack's default scrape targets cannot
  # exist here and KubeProxyDown / KubeControllerManagerDown / KubeSchedulerDown
  # fire permanently with no way to clear. Unclearable alerts are how a real one
  # goes unread, so drop the exporters and their rules rather than silencing the
  # symptom downstream. kubeEtcd is the exception: k3s can expose it with
  # etcd-expose-metrics, but there is no etcd pod for the default ServiceMonitor
  # to select and ArgoCD excludes the Endpoints kind the chart would otherwise
  # use, so the node IPs are scraped by templates/scrapeconfig-etcd.yaml instead.
  # kubeEtcd stays enabled so the etcd alert rules still render.
  kubeProxy:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    service:
      enabled: false
    serviceMonitor:
      enabled: false
  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      # ScrapeConfig was the one selector still defaulting to the release label,
      # so first-party ScrapeConfigs were invisible to it.
      scrapeConfigSelectorNilUsesHelmValues: false
      # The TSDB was an emptyDir - 15.6G on the node, discarded every restart.
      # 30d costs ~47G at current ingestion, so the clock expires data and
      # retentionSize is only a backstop against series growth.
      retention: 30d
      retentionSize: 48GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: standard-rwo
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 60Gi
      additionalAlertRelabelConfigs:
        - source_labels: [alertname]
          regex: CephPGImbalance|CephHealthWarning|CephNodeDiskspaceWarning
          action: drop
  alertmanager:
    alertmanagerSpec:
      # Mounts at /etc/alertmanager/secrets/deadmansswitch/. The ping URL is a
      # capability URL - anyone holding it can satisfy the heartbeat - so it
      # stays out of git. Alertmanager will not start if this secret is absent.
      secrets:
        - deadmansswitch
      containers:
        - name: ntfy-relay
          image: ghcr.io/khuedoan/webhook-transformer:v0.0.3
          args:
            - --port=8081
            - --config=/config/alertmanager-to-ntfy.jsonnet
            - --upstream-host=https://ntfy.sh
          envFrom:
            - secretRef:
                name: webhook-transformer
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: webhook-transformer
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Watchdog fires permanently by design - it is the heartbeat proving
          # this pipeline is alive, and the chart routes it to the null receiver
          # for that reason. Sending it to the phone twice a day is what trains
          # you to mute the topic, and a muted topic is why a real
          # NodeClockNotSynchronising went unread. It goes to a dead man's switch
          # instead: an external service that pages when the heartbeat STOPS,
          # which is the only check that catches monitoring itself dying.
          # The cadence needs its own group_interval, not just repeat_interval.
          # Alertmanager only re-evaluates a group when its group_interval timer
          # fires, so a 5m repeat under the parent's 5m group_interval lands on
          # the boundary and slips to 10m about half the time - which is exactly
          # what made healthchecks.io report the check late. A 1m tick with a 2m
          # repeat pings every 2-3m with margin to spare.
          - receiver: deadmansswitch
            matchers:
              - alertname = "Watchdog"
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 2m
          # InfoInhibitor exists only to be an inhibition source for other info
          # alerts - it has no description, no runbook, and nothing a human can
          # act on. The chart routes it to null alongside Watchdog; overriding
          # that route above dropped it, which is why it has been notifying.
          # Muted here rather than dropped like the rook alerts above: it has to
          # reach Alertmanager to work as an inhibition source.
          - receiver: "null"
            matchers:
              - alertname = "InfoInhibitor"
      receivers:
        # Overriding `receivers` replaces the chart's list rather than merging
        # into it, so the null receiver the routes above depend on has to be
        # redeclared here.
        - name: "null"
        - name: ntfy
          webhook_configs:
            - url: http://localhost:8081
              send_resolved: true
        - name: deadmansswitch
          webhook_configs:
            - url_file: /etc/alertmanager/secrets/deadmansswitch/url
              send_resolved: false
