{{- $root := . }}
{{- $folders := dict }}
{{- range $path, $content := .Files.Glob "files/dashboards/**.json" }}
  {{- $parts := splitList "/" $path }}
  {{- if eq (len $parts) 4 }}
    {{- $set := set $folders (index $parts 2) "" }}
  {{- end }}
{{- end }}
{{- range $folder := keys $folders | sortAlpha }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-{{ $folder }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ $folder }}
data:
{{ ($root.Files.Glob (printf "files/dashboards/%s/*.json" $folder)).AsConfig | indent 2 }}
{{- end }}
