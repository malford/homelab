apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deadmansswitch
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: deadmansswitch
  data:
    # Alertmanager mounts this as /etc/alertmanager/secrets/deadmansswitch/url
    # and reads it via url_file, so the ping URL never enters the rendered
    # config. secretKey must stay `url` - it is the filename.
    - secretKey: url
      remoteRef:
        key: external
        property: deadmansswitch-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook-transformer
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: webhook-transformer
  data:
    # Consumed as an env var by the ntfy-relay sidecar's jsonnet. The topic name
    # is the only credential the unauthenticated ntfy.sh model has - anyone who
    # learns it can both read and publish - so it is a secret, not a value.
    # The old Terraform-managed secret also carried NTFY_URL, which nothing ever
    # read; the relay takes its host from --upstream-host. Not reproduced here.
    - secretKey: NTFY_TOPIC
      remoteRef:
        key: external
        property: ntfy-topic
