apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deadmansswitch
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: deadmansswitch
  data:
    # Alertmanager mounts this as /etc/alertmanager/secrets/deadmansswitch/url
    # and reads it via url_file, so the ping URL never enters the rendered
    # config. secretKey must stay `url` - it is the filename.
    - secretKey: url
      remoteRef:
        key: external
        property: deadmansswitch-url
