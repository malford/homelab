{{/*
One ExternalSecret per protected PVC, rendered into the app's own namespace - the
restic mover reads the Secret from the same namespace as the ReplicationSource.

The shared RESTIC_PASSWORD comes from the generated `volsync.restic` entry in
global-secrets; the per-app RESTIC_REPOSITORY is composed here so the repo layout
stays a property of this chart rather than something stored in the secret backend.
*/}}
{{- range $entry := .Values.backups }}
{{- if ne $entry.enabled false }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "volsync-backups.secretName" $entry }}
  namespace: {{ $entry.namespace }}
  labels:
    {{- include "volsync-backups.labels" $ | nindent 4 }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: {{ include "volsync-backups.secretName" $entry }}
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: {{ include "volsync-backups.repository" (dict "root" $ "entry" $entry) | quote }}
        RESTIC_PASSWORD: {{ `{{ .RESTIC_PASSWORD }}` | quote }}
  dataFrom:
    - extract:
        key: volsync.restic
{{- end }}
{{- end }}
