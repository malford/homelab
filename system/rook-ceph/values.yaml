rook-ceph:
  monitoring:
    enabled: true
  # `enableVolumeGroupSnapshot` and `rookUseCsiOperator` both existed here and
  # are both removed in 1.20 — the CSI operator is now the only option, so the
  # old opt-out is gone rather than defaulted.
ceph-csi-drivers:
  # The chart emits `namespace:` unconditionally and defaults it to "", so an
  # unset value renders an explicitly empty field rather than omitting it.
  operatorConfig:
    namespace: rook-ceph
    driverSpecDefaults:
      # Rook writes this configmap with the image versions it expects, but the
      # chart defaults the reference to "" and omits the field, so the operator
      # fell back to its compiled-in images and pinned cephcsi a patch behind.
      imageSet:
        name: rook-csi-operator-image-set-configmap
  drivers:
    # StorageClass provisioners and the live CSIDriver objects are immutable and
    # carry the `rook-ceph.` prefix. The chart defaults are unprefixed, which
    # would strand both StorageClasses on a driver that never appears.
    rbd:
      name: rook-ceph.rbd.csi.ceph.com
      # Chart defaults rbd to `none` but cephfs to `volumeSnapshot`. `none`
      # drops the csi-snapshotter sidecar, so every VolSync backup hangs.
      snapshotPolicy: volumeSnapshot
    cephfs:
      name: rook-ceph.cephfs.csi.ceph.com
    # nfs is served by csi-driver-nfs; nvmeof is unused.
    nfs:
      enabled: false
    nvmeof:
      enabled: false
snapshot-controller:
  # 3.0.6 shipped CRDs in Helm's crds/ dir, which is never pruned. 5.x templates
  # them, so without this a dep change could prune every VolumeSnapshot.
  keepCRDs: true
rook-ceph-cluster:
  monitoring:
    enabled: true
    createPrometheusRules: true
  # Pinned so a chart bump upgrades only the operator, not Ceph itself.
  # 1.19 moved this out of cephClusterSpec.cephVersion; setting both renders a
  # duplicate YAML key. Dated tag keeps all six nodes on an identical build.
  cephImage:
    tag: v19.2.6-20260818
  cephClusterSpec:
    storage:
      useAllNodes: true
      useAllDevices: false
      devices:
        # Names are matched per node and misses are ignored, so the old
        # single-VG layout and the rebuilt `ceph/osd` one can coexist. Drop the
        # two `system-*` entries once every node has been rebuilt.
        - name: "/dev/mapper/system-ceph--storage"
        - name: "/dev/mapper/system-ceph"
        - name: "/dev/mapper/ceph-osd"
    mon:
      count: 3
    mgr:
      count: 2
    dashboard:
      ssl: false
    logCollector:
      enabled: false
    removeOSDsIfOutAndSafeToRemove: true
    security:
      cephx:
        # 19.2.6 flags the legacy `aes` keys as HEALTH_ERR. Rotating daemon keys
        # mints aes256k and leaves PVCs mounted; rook picks the type itself.
        daemon:
          keyRotationPolicy: KeyGeneration
          keyGeneration: 2
        csi:
          # Chart default, re-pinned: aes256k needs kernel 7.0+ and ceph-csi
          # 3.17.1+. Nodes are AlmaLinux 10.2 on 6.12 and the EL10 kernel line
          # never ships aes256k, so rotating CSI keys would break new mounts.
          keyType: aes
        # Unused — no peers configured, so nothing consumes the token. The
        # kernel and ceph-csi floors are what keep client keys on `aes`.
        rbdMirrorPeer:
          keyRotationPolicy: KeyGeneration
          keyGeneration: 2
    resources:
      mgr:
        limits:
          memory: "1Gi"
        requests:
          cpu: "100m"
          memory: "512Mi"
      mon:
        limits:
          memory: "2Gi"
        requests:
          cpu: "100m"
          memory: "100Mi"
      osd:
        limits:
          memory: "4Gi"
        requests:
          cpu: "100m"
          memory: "512Mi"
  cephBlockPools:
    - name: standard-rwo
      spec:
        replicated:
          size: 2
      storageClass:
        enabled: true
        name: standard-rwo
        isDefault: true
        allowVolumeExpansion: true
        parameters:
          imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
  cephBlockPoolsVolumeSnapshotClass:
    enabled: true
    isDefault: true
  cephFileSystems:
    - name: standard-rwx
      spec:
        metadataPool:
          replicated:
            size: 2
        dataPools:
          - name: data0
            replicated:
              size: 2
        metadataServer:
          activeCount: 1
          activeStandby: true
          # Rook only sets a *preferred* anti-affinity, which let the active and
          # standby MDS land on one node — wiping it would take CephFS offline.
          # Scoped to this filesystem so a second one is not blocked.
          placement:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: rook-ceph-mds
                      rook_file_system: standard-rwx
                  topologyKey: kubernetes.io/hostname
          resources:
            limits:
              memory: "4Gi"
            requests:
              cpu: "100m"
              memory: "100Mi"
          priorityClassName: system-cluster-critical
      storageClass:
        enabled: true
        name: standard-rwx
        isDefault: false
        allowVolumeExpansion: true
        pool: data0
        parameters:
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
  cephFileSystemVolumeSnapshotClass:
    enabled: true
    isDefault: false
  cephObjectStores: []

alerts:
  enabled: true
  # Namespace for the PrometheusRule. Prometheus selects rules cluster-wide
  # (ruleSelector is empty in system/monitoring-system).
  namespace: rook-ceph
  # HEALTH_WARN checks that are known, accepted and permanently active. Rook's
  # stock CephHealthWarning is bare `ceph_health_status == 1` with no label for
  # which check fired, so it cannot be scoped and is routed to null in
  # system/monitoring-system. These rules replace it: anything outside this list
  # still pages. Remove entries as the cephx keys above are migrated.
  acceptedHealthWarnings:
    - AUTH_INSECURE_CLIENT_KEY_TYPE
    - AUTH_INSECURE_KEYS_ALLOWED
    - AUTH_INSECURE_KEYS_CREATABLE
