{{- range .Values.egress }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # fqdn, not tailnet-ip: the 100.x address is reassigned if the device is
    # removed and re-added, and the name is what the certificate is issued for.
    tailscale.com/tailnet-fqdn: {{ .fqdn | quote }}
spec:
  type: ExternalName
  # Overwritten by the operator with its proxy Service. A placeholder is
  # required because the API rejects an empty externalName.
  externalName: placeholder
  ports:
    {{- range .ports }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: TCP
    {{- end }}
{{- end }}
