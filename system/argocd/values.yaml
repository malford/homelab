argo-cd:
  global:
    domain: argocd.malford.io
    serverSideapply: false
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: true
    cm:
      resource.ignoreResourceUpdatesEnabled: true
      resource.customizations.ignoreResourceUpdates.all: |
        jsonPointers:
          - /status
  crds:
    install: false
  server:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls: true
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: true
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
argocd-apps:
  applicationsets:
    root:
      namespace: argocd
      generators:
        - git:
            repoURL: &repoURL http://gitea-http.gitea:3000/ops/homelab
            revision: &revision main
            directories:
              - path: system/*
              - path: platform/*
              - path: apps/*
              # Exclude argocd because of serversidediff keeps failing
              - path: system/argocd
                exclude: true
              # The media stack is generated by the `media` ApplicationSet below,
              # which puts every app in the shared `media` namespace. Excluding
              # the parent directory is enough - `apps/*` does not match
              # `apps/media/sonarr`.
              - path: apps/media
                exclude: true
              # TRANSITIONAL: the charts used to live flat in apps/. These
              # exclusions keep `root` off them until the move has been pushed
              # and the `media` ApplicationSet has re-matched at the new paths.
              # Remove together with the old paths in the `media` generator.
              - path: apps/flaresolverr
                exclude: true
              - path: apps/jackett
                exclude: true
              - path: apps/jellyfin
                exclude: true
              - path: apps/jellyseerr
                exclude: true
              - path: apps/lidarr
                exclude: true
              - path: apps/plex
                exclude: true
              - path: apps/prowlarr
                exclude: true
              - path: apps/radarr
                exclude: true
              - path: apps/sabnzbd
                exclude: true
              - path: apps/sonarr
                exclude: true
              - path: apps/transmission
                exclude: true
      template:
        metadata:
          name: '{{path.basename}}'
        spec:
          destination:
            name: in-cluster
            namespace: '{{path.basename}}'
          project: default  # TODO
          source:
            repoURL: *repoURL
            path: '{{path}}'
            targetRevision: *revision
          ignoreDifferences:
            - group: ""
              kind: Service
              name: aperture
              jsonPointers:
                - /spec/externalName
                - /spec/type
                - /spec/clusterIP
                - /spec/clusterIPs
          syncPolicy:
            automated: &automated
              prune: true
              selfHeal: true
            retry: &retry
              limit: 10
              backoff:
                duration: 1m
                factor: 2
                maxDuration: 16m
            syncOptions: &syncOptions
              - CreateNamespace=true
              - ApplyOutOfSyncOnly=true
    # The media stack shares one namespace, so it cannot use `root`'s
    # namespace-per-directory template. Everything else about it is identical -
    # same repo, same revision, same sync policy - so it reuses the anchors
    # above rather than restating them.
    media:
      namespace: argocd
      syncPolicy:
        # Generated Applications do not get the cascade finalizer, so removing
        # an app from git cannot take its config PVC with it. Trade-off: the
        # leftover Deployment/PVC then need cleaning up by hand.
        preserveResourcesOnDeletion: true
      generators:
        - git:
            repoURL: *repoURL
            revision: *revision
            directories:
              - path: apps/media/*
              # TRANSITIONAL: the old flat paths, kept only so this
              # ApplicationSet adopts the existing Applications on the commit
              # that moves them. `directories` is a union, so listing both means
              # no Application is ever un-generated mid-migration. Remove once
              # the move is pushed, along with the matching exclusions above.
              - path: apps/flaresolverr
              - path: apps/jackett
              - path: apps/jellyfin
              - path: apps/jellyseerr
              - path: apps/lidarr
              - path: apps/plex
              - path: apps/prowlarr
              - path: apps/radarr
              - path: apps/sabnzbd
              - path: apps/sonarr
              - path: apps/transmission
      template:
        metadata:
          name: '{{path.basename}}'
        spec:
          destination:
            name: in-cluster
            namespace: media
          project: default  # TODO
          source:
            repoURL: *repoURL
            path: '{{path}}'
            targetRevision: *revision
          syncPolicy:
            automated: *automated
            retry: *retry
            syncOptions: *syncOptions
