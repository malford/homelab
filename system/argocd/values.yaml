argo-cd:
  global:
    domain: argocd.malford.io
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: true
      # Chart 9.0.0 stopped shipping a default for this; the deployment reads it
      # via an optional configMapKeyRef, so leaving it unset would hand control
      # to an unpinned binary default. Pin the behaviour we already run on.
      applicationsetcontroller.policy: sync
    cm:
      # Not a chart default, so it has to stay explicit.
      resource.ignoreResourceUpdatesEnabled: true
      # Argo CD 3.0 defaults resource tracking to `annotation`. Every app
      # inherits ApplyOutOfSyncOnly=true from the syncOptions anchor below, and
      # upstream flags that pairing as liable to orphan resources on migration.
      # Staying on `label` keeps the upgrade a no-op for existing apps.
      application.resourceTrackingMethod: label
  crds:
    install: true
  server:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls: true
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: true
  dex:
    enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  # No `redis: metrics:` here. The anchor above means "component metrics plus a
  # ServiceMonitor", but redis additionally needs `exporter.enabled` to get the
  # redis_exporter sidecar that serves :9121. Reusing the anchor produced a
  # Service and a ServiceMonitor whose named targetPort matched nothing on a pod
  # declaring only `redis=6379`, so it scraped empty endpoints for 232 days.
argocd-apps:
  applicationsets:
    root:
      namespace: argocd
      generators:
        - git:
            repoURL: &repoURL http://gitea-http.gitea:3000/ops/homelab
            revision: &revision main
            directories:
              - path: system/*
              - path: platform/*
              - path: apps/*
              # Exclude argocd because of serversidediff keeps failing
              - path: system/argocd
                exclude: true
              # The media stack is generated by the `media` ApplicationSet below,
              # which puts every app in the shared `media` namespace. Excluding
              # the parent directory is enough - `apps/*` does not match
              # `apps/media/sonarr`.
              - path: apps/media
                exclude: true
      template:
        metadata:
          name: '{{path.basename}}'
        spec:
          destination:
            name: in-cluster
            namespace: '{{path.basename}}'
          project: default  # TODO
          source:
            repoURL: *repoURL
            path: '{{path}}'
            targetRevision: *revision
          ignoreDifferences:
            - group: ""
              kind: Service
              name: aperture
              jsonPointers:
                - /spec/externalName
                - /spec/type
                - /spec/clusterIP
                - /spec/clusterIPs
          syncPolicy:
            automated: &automated
              prune: true
              selfHeal: true
            retry: &retry
              limit: 10
              backoff:
                duration: 1m
                factor: 2
                maxDuration: 16m
            syncOptions: &syncOptions
              - CreateNamespace=true
              - ApplyOutOfSyncOnly=true
              # Client-side apply stores the entire manifest in the
              # last-applied-configuration annotation, which Kubernetes caps at
              # 262144 bytes. Six kube-prometheus-stack CRDs and two
              # external-secrets CRDs exceed that, so those apps could never
              # finish a sync. The cap is a property of client-side apply rather
              # than of any one app, so this belongs on the shared anchor.
              # controller.diff.server.side above only makes *diffing*
              # server-side; applying needs this too.
              - ServerSideApply=true
    # The media stack shares one namespace, so it cannot use `root`'s
    # namespace-per-directory template. Everything else about it is identical -
    # same repo, same revision, same sync policy - so it reuses the anchors
    # above rather than restating them.
    media:
      namespace: argocd
      syncPolicy:
        # Generated Applications do not get the cascade finalizer, so removing
        # an app from git cannot take its config PVC with it. Trade-off: the
        # leftover Deployment/PVC then need cleaning up by hand.
        preserveResourcesOnDeletion: true
      generators:
        - git:
            repoURL: *repoURL
            revision: *revision
            directories:
              - path: apps/media/*
              # Shared values, not a chart - see apps/media/_shared/base.yaml.
              # `apps/media/*` matches it, so it needs excluding or it would
              # generate an Application with nothing to deploy.
              - path: apps/media/_shared
                exclude: true
      template:
        metadata:
          name: '{{path.basename}}'
        spec:
          destination:
            name: in-cluster
            namespace: media
          project: default  # TODO
          source:
            repoURL: *repoURL
            path: '{{path}}'
            targetRevision: *revision
            helm:
              # Shared defaults first, the app's own values second, so the app
              # wins on any key it restates. A leading `/` is relative to the
              # repository root, not to the Application's own path.
              #
              # ignoreMissingValueFiles is load-bearing: media-shared has no
              # values.yaml at all, and without this its render would fail.
              ignoreMissingValueFiles: true
              valueFiles:
                - /apps/media/_shared/base.yaml
                - values.yaml
          syncPolicy:
            automated: *automated
            retry: *retry
            syncOptions: *syncOptions
