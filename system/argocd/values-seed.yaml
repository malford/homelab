argo-cd:
  server:
    metrics: &metrics
      enabled: false
      serviceMonitor:
        enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  # Deliberately no `redis: metrics:` - see the note in values.yaml.
argocd-apps:
  applicationsets:
    root:
      generators:
        - git:
            repoURL: &repoURL https://github.com/malford/homelab
            revision: &revision main
            directories:
              - path: system/*
              - path: platform/*
              - path: apps/*
              # A list override replaces values.yaml's wholesale, so both
              # exclusions have to be restated here or seed mode loses them.
              - path: system/argocd
                exclude: true
              - path: apps/media
                exclude: true
      template:
        spec:
          source:
            repoURL: *repoURL
            targetRevision: *revision
