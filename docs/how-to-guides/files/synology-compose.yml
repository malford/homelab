# Container Manager project on the NAS at 192.168.3.20.
#
# NOT DEPLOYED FROM HERE. This is the source of truth for a file that lives
# only in the Container Manager UI - paste it in, do not expect a sync.
#
# The three ports below are the entire contract with the cluster. Drop any of
# them and the matching ScrapeConfig in system/monitoring-system goes down.
version: "3.9"

services:
  node-exporter:
    image: prom/node-exporter:latest
    command:
      - --collector.disable-defaults
      - --collector.stat
      - --collector.time
      - --collector.cpu
      - --collector.loadavg
      - --collector.hwmon
      - --collector.meminfo
      - --collector.diskstats
    container_name: node_exporter
    hostname: nodeexporter
    networks:
      - prometheus_net
    ports:
      - "9100:9100"
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    security_opt:
      - no-new-privileges=true
    read_only: true
    user: 1026:100
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9100/
    restart: unless-stopped

  snmp-exporter:
    image: prom/snmp-exporter:latest
    command:
      - '--config.file=/etc/snmp_exporter/snmp.yml'
    container_name: snmp_exporter
    hostname: snmp
    networks:
      - prometheus_net
    ports:
      - "9116:9116"
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    security_opt:
      - no-new-privileges=true
    read_only: true
    user: 1026:100
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9116/ || exit 1
    volumes:
      # snmpv3 credentials live here and stay on the NAS.
      - ./snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    command:
      - '--docker_only=true'
    container_name: cadvisor
    hostname: cadvisor
    networks:
      - prometheus_net
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    security_opt:
      - no-new-privileges=true
    read_only: true
    ports:
      # 8080 collides with DSM; 9338 is cadvisor's registered port.
      - "9338:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

networks:
  prometheus_net:
    name: prometheus_net
    ipam:
      config:
        - subnet: 172.22.0.0/24
