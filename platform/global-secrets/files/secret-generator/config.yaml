# Gitea
- name: gitea.admin
  data:
    - key: password
      length: 32
      special: true

# Dex
- name: dex.grafana
  data:
    - key: client_secret
      length: 32
      special: false
- name: dex.gitea
  data:
    - key: client_secret
      length: 32
      special: false

# Registry
- name: registry.admin
  data:
    - key: password
      length: 32
      special: true

# Woodpecker
- name: woodpecker.agent
  data:
    - key: secret
      length: 32
      special: false

# Paperless
- name: paperless.admin
  data:
    - key: PAPERLESS_ADMIN_PASSWORD
      length: 32
      special: true

# VolSync / restic
# WARNING: this password encrypts every backup repository. The generator never
# rotates an existing key, but if the global-secrets namespace is ever wiped a new
# password is minted and all existing repositories become permanently unreadable.
# Record it offline — see docs/how-to-guides/backup-and-restore.md.
- name: volsync.restic
  data:
    - key: RESTIC_PASSWORD
      length: 48
      special: false
