{{- $image := printf "%s:%s" .Values.secretGenerator.image.repository .Values.secretGenerator.image.tag }}
apiVersion: batch/v1
kind: Job
metadata:
  # spec.template is immutable, so the image has to feed the name too.
  name: secret-generator-{{ printf "%s%s" (include (print $.Template.BasePath "/secret-generator/configmap.yaml") .) $image | sha256sum | trunc 7 }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: secret-generator
          image: {{ $image }}
          workingDir: /go/src/secret-generator
          command:
            - sh
            - -c
          args:
            - |
              go get .
              go run .
          volumeMounts:
            - name: source
              mountPath: /go/src/secret-generator
      serviceAccount: secret-generator
      volumes:
        - name: source
          configMap:
            name: secret-generator
