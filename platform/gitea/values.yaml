gitea:
  # gitea-shared-storage is RWO, so it attaches to one node at a time, while the
  # chart's default maxUnavailable: 0 holds the old pod until the new one is
  # Ready. Unsatisfiable unless both land on the same node, which is why
  # upgrades only worked by scheduling luck. rollingUpdate must be nulled or the
  # chart default survives the merge and the API rejects the Deployment.
  strategy:
    type: Recreate
    rollingUpdate: null
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: &host git.malford.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gitea-tls-certificate
        hosts:
          - *host
  gitea:
    admin:
      existingSecret: gitea-admin-secret
    config:
      server:
        LANDING_PAGE: explore
        ROOT_URL: https://git.malford.io
        OFFLINE_MODE: true
      repository:
        DISABLED_REPO_UNITS: repo.wiki,repo.projects,repo.packages
        DISABLE_STARS: true
        DEFAULT_BRANCH: main
      # TODO it's not reading the username from Dex correctly for now, related issues:
      # https://github.com/go-gitea/gitea/issues/25725
      # https://github.com/go-gitea/gitea/issues/24957
      # oauth2_client:
      #   ENABLE_AUTO_REGISTRATION: true
      #   USERNAME: userid
      service.explore:
        DISABLE_USERS_PAGE: true
      actions:
        ENABLED: true
      webhook:
        ALLOWED_HOST_LIST: private

  postgresql-ha:
    postgresql:
      extendedConfiguration: |
        shared_buffers = 256MB
        work_mem = 4MB
        maintenance_work_mem = 32MB
        max_connections = 50
        wal_buffers = 8MB
        effective_cache_size = 512MB
      resources:
        limits:
          memory: 2048Mi
          cpu: 500m
        requests:
          memory: 1024Mi
          cpu: 250m
    pgpool:
      numInitChildren: 8
      maxPool: 2
      resources:
        limits:
          memory: 512Mi
          cpu: 250m
        requests:
          memory: 256Mi
          cpu: 100m
