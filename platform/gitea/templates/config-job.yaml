{{- $image := printf "%s:%s" .Values.configJob.image.repository .Values.configJob.image.tag }}
apiVersion: batch/v1
kind: Job
metadata:
  # spec.template is immutable, so the image has to feed the name too.
  name: gitea-config-{{ printf "%s%s" (include (print $.Template.BasePath "/config-source.yaml") .) $image | sha256sum | trunc 7 }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: apply
          image: {{ $image }}
          env:
            - name: GITEA_HOST
              value: http://gitea-http:3000
            - name: GITEA_USER
              valueFrom:
                secretKeyRef:
                  name: gitea-admin-secret
                  key: username
            - name: GITEA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin-secret
                  key: password
          workingDir: /go/src/gitea-config
          command:
            - sh
            - -c
          args:
            - |
              go get .
              go run .
          volumeMounts:
            - name: source
              mountPath: /go/src/gitea-config
      volumes:
        - name: source
          configMap:
            name: gitea-config-source
