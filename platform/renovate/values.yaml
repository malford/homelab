renovate:
  cronjob:
    schedule: '0 */6 * * *'  # Every six hours
    # Unset lets the CronJob controller fall back to the host's zone.
    timeZone: America/New_York
    # Each retained pod pins a container layer on its node's 32G image LV.
    successfulJobsHistoryLimit: 1
  renovate:
    config: |
      {
        "platform": "gitea",
        "endpoint": "https://git.malford.io/api/v1",
        "gitAuthor": "Renovate Bot <bot@renovateapp.com>",
        "autodiscover": true,
        "exitCodeForErrors": true
      }
  existingSecret: renovate-secret
