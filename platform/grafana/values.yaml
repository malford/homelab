grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - &host grafana.malford.io
    tls:
      - secretName: grafana-general-tls
        hosts:
          - *host
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
      # Lets a ConfigMap choose its folder. The 26 kube-prometheus-stack
      # dashboards carry no annotation and stay where they are, in General.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      searchNamespace: monitoring-system
  envFromSecret: grafana-secrets
  grafana.ini:
    server:
      root_url: https://grafana.malford.io
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Admin
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.malford.io/auth
      token_url: https://dex.malford.io/token
      api_url: https://dex.malford.io/userinfo
  # Provision grafana-dashboards-kubernetes
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'grafana-dashboards-kubernetes'
        orgId: 1
        folder: 'kubernetes'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
      - name: 'grafana-dashboards-storage'
        orgId: 1
        folder: 'rook-ceph'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/grafana-dashboards-storage
      - name: 'grafana-dashboards-network'
        orgId: 1
        folder: 'network'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/grafana-dashboards-network
  dashboards:
    # The UniFi boards you ran on the NAS were the InfluxDB variants. InfluxQL
    # does not translate to PromQL, so these are the author's Prometheus-native
    # equivalents rather than a port: 11315<-10418, 11311<-10414, 11314<-10415,
    # 11313<-10416. 11310 is new - UP_UNIFI_DEFAULT_SAVE_DPI feeds it.
    grafana-dashboards-network:
      unifi-client-insights:
        gnetId: 11315
        revision: 9
      unifi-network-sites:
        gnetId: 11311
        revision: 5
      unifi-uap-insights:
        gnetId: 11314
        revision: 10
      unifi-usg-insights:
        gnetId: 11313
        revision: 9
      unifi-client-dpi:
        gnetId: 11310
        revision: 5
    grafana-dashboards-storage:
      ceph-dashboard:
        gnetId: 2842
        revision: 18
    grafana-dashboards-kubernetes:
      k8s-system-api-server:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
        token: ''
      k8s-system-coredns:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
        token: ''
      k8s-views-global:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
        token: ''
      k8s-views-namespaces:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
        token: ''
      k8s-views-nodes:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
        token: ''
      k8s-views-pods:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
        token: ''
