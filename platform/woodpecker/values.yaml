woodpecker:
  agent:
    mapAgentSecret: false
    extraSecretNamesForEnvFrom:
      - woodpecker-secret
    env:
      WOODPECKER_BACKEND_K8S_STORAGE_RWX: false
      # Steps run as their own pods on the Kubernetes backend, not on the agent
      # pod, so one agent can carry many concurrent workflows.
      WOODPECKER_MAX_WORKFLOWS: 10
  server:
    createAgentSecret: false
    extraSecretNamesForEnvFrom:
      - woodpecker-secret
    env:
      WOODPECKER_HOST: https://ci.malford.io
      WOODPECKER_WEBHOOK_HOST: http://woodpecker-server.woodpecker
      WOODPECKER_GITEA: true
      WOODPECKER_GITEA_URL: https://git.malford.io
      WOODPECKER_OPEN: true
      WOODPECKER_ADMIN: gitea_admin
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      ingressClassName: nginx
      hosts:
        - host: &host ci.malford.io
          paths:
            - path: /
      tls:
        - secretName: woodpecker-tls-certificate
          hosts:
            - *host
