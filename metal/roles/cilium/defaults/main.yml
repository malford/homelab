cilium_repo_url: https://helm.cilium.io
cilium_version: 1.19.8
cilium_namespace: kube-system
cilium_values:
  # Pins datapath defaults to the originally-installed minor so the upgrade
  # does not flip behaviour cilium only enables for fresh installs.
  upgradeCompatibility: "1.16"
  operator:
    replicas: 1
  kubeProxyReplacement: true
  l2announcements:
    enabled: true
  # TODO the host and port are k3s-specific, generic solution is in progress
  # https://github.com/cilium/cilium/issues/19038
  # https://github.com/cilium/cilium/pull/28741
  k8sServiceHost: 127.0.0.1
  k8sServicePort: 6444
  hubble:
    relay:
      enabled: true
    ui:
      enabled: true
