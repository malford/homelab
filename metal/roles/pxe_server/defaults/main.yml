# AlmaLinux 10 is RHEL-compatible, so anaconda/kickstart PXE keeps working and
# minor releases (10.2 -> 10.3) upgrade in place via dnf instead of a reimage.
iso_url: "https://repo.almalinux.org/almalinux/10.2/isos/x86_64/AlmaLinux-10.2-x86_64-boot.iso"
iso_checksum: "sha256:b3f865468075bcada8f208d830289302c67529789d668041d24e8d6fc697ba6a"
# boot.iso ships the PXE kernel and installer but no packages, so a build pulls
# current ones from the mirror. For an offline install, switch iso_url to
# AlmaLinux-10.2-x86_64-dvd.iso and point these at http://<jumpbox>/os.
install_repo_baseos: "https://repo.almalinux.org/almalinux/10/BaseOS/x86_64/os/"
install_repo_appstream: "https://repo.almalinux.org/almalinux/10/AppStream/x86_64/os/"
timezone: America/New_York
dhcp_proxy: false
