- name: Get Docker info
  docker_host_info: {}
  register: docker_info_result

- name: Ensure Docker is running on a supported operating system
  fail:
    msg: Docker host networking driver only works on Linux hosts, and is not supported on Docker Desktop for Mac or Windows (you can use a Linux VM with bridged networking instead)
  when:
    - docker_info_result.host_info.OperatingSystem == "Docker Desktop"

- name: Download boot image
  ansible.builtin.get_url:
    url: "{{ iso_url }}"
    dest: "{{ role_path }}/files/data/iso/{{ iso_url | basename }}"
    checksum: "{{ iso_checksum }}"
    mode: 0644
  register: iso

# Every release ships a .treeinfo, so gating on that path kept a previously
# extracted tree in place after an iso_url bump and served the old distro's
# kernel with the new kickstart. Gate on the ISO name instead.
- name: Check which ISO the boot image tree came from
  ansible.builtin.stat:
    path: "{{ boot_image_marker }}"
  register: boot_image

- name: Clear a boot image tree extracted from a different ISO
  ansible.builtin.command:
    cmd: "find {{ role_path }}/files/data/os -mindepth 1 -not -name .gitignore -delete"
  when: not boot_image.stat.exists
  changed_when: true

- name: Extract boot image
  ansible.builtin.command:
    cmd: "xorriso -osirrox on -indev {{ iso.dest }} -extract / {{ role_path }}/files/data/os"
    creates: "{{ boot_image_marker }}"

# xorriso preserves the permissions recorded in the ISO, and AlmaLinux ships
# EFI/BOOT/grubx64.efi as 0700 root. dnsmasq and nginx drop privileges, so TFTP
# fails with "Permission denied" and the client falls through to disk boot.
- name: Make the boot image tree readable by the PXE containers
  ansible.builtin.file:
    path: "{{ role_path }}/files/data/os"
    mode: u=rwX,go=rX
    recurse: true

- name: Record which ISO the boot image tree came from
  ansible.builtin.copy:
    content: "{{ iso_url | basename }}\n"
    dest: "{{ boot_image_marker }}"
    mode: 0644

- name: Generate dnsmasq config
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: "{{ role_path }}/files/data/pxe-config/dnsmasq.conf"
    mode: 0644

- name: Generate GRUB config
  ansible.builtin.template:
    src: grub.cfg.j2
    dest: "{{ role_path }}/files/data/pxe-config/grub.cfg"
    mode: 0644

- name: Generate init config for each machine
  ansible.builtin.template:
    src: kickstart.ks.j2
    dest: "{{ role_path }}/files/data/init-config/{{ hostvars[item]['mac'] }}.ks"
    mode: 0644
  loop: "{{ groups['metal'] }}"

- name: Start the ephemeral PXE server
  community.docker.docker_compose_v2:
    project_src: "{{ role_path }}/files"
    state: present
    build: always
    # vmlinuz/initrd.img are bind-mounted as files, so a container left running
    # from a previous boot would keep serving the replaced inodes.
    recreate: always
