# renovate: datasource=github-releases depName=k3s-io/k3s
k3s_version: v1.36.5+k3s1
# Control-plane VIP static pod. The 0.x -> 1.x hop is deliberate, not automatic.
# renovate: datasource=github-releases depName=kube-vip/kube-vip
kube_vip_version: v1.3.1
# Host the role delegates cluster-wide lookups to (token, kubeconfig, kubectl
# waits). Override when rebuilding that host: `-e k3s_primary=metal3v2`.
k3s_primary: "{{ groups['masters'][0] }}"
# Only true for the very first server of a brand new cluster. A wiped node with
# no etcd datastore on disk would honour this flag and initialise an empty
# cluster instead of joining, so it stays off unless asked for explicitly.
k3s_cluster_init: false
k3s_config_file: /etc/rancher/k3s/config.yaml
k3s_token_file: /etc/rancher/node/password
k3s_service_file: /etc/systemd/system/k3s.service
k3s_data_dir: /var/lib/rancher/k3s
k3s_kubeconfig_file: /etc/rancher/k3s/k3s.yaml
k3s_server_config:
  tls-san:
    - "{{ control_plane_endpoint }}"
  disable:
    - local-storage
    - servicelb
    - traefik
  disable-helm-controller: true
  disable-kube-proxy: true
  disable-network-policy: true
  flannel-backend: none
  secrets-encryption: true
