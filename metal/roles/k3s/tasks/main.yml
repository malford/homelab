- name: Download k3s binary
  ansible.builtin.get_url:
    url: https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s
    checksum: sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt
    dest: "{{ role_path }}/files/bin/k3s"
    mode: 0755
  delegate_to: localhost
  run_once: true

- name: Copy k3s binary to nodes
  ansible.builtin.copy:
    src: bin/k3s
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: 0755
  notify: Restart k3s

- name: Ensure config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  loop:
    - /etc/rancher/k3s
    - /etc/rancher/node
    - "{{ k3s_data_dir }}/agent/pod-manifests"

# `run_once` is per-batch, so under `serial` it fires on every host and each
# would mint its own token. Anchor to `k3s_primary` by name instead.
- name: Check if k3s token file exists on the first node
  delegate_to: "{{ k3s_primary }}"
  ansible.builtin.stat:
    path: "{{ k3s_token_file }}"
  register: k3s_token_file_stat

# A wiped node has no token file, so an un-overridden `k3s_primary` pointing at
# the node being rebuilt would mint a fresh token here and hand the whole fleet
# a secret the cluster does not know. Only a brand new cluster may generate one.
- name: Fail when the delegation target has no token and this is not a new cluster
  when:
    - not k3s_token_file_stat.stat.exists
    - not k3s_cluster_init | bool
  ansible.builtin.fail:
    msg: >-
      {{ k3s_primary }} has no {{ k3s_token_file }}, so it cannot be the token
      source. It is probably the node being rebuilt — re-run with
      `-e k3s_primary=<a node that is Ready>`.

- name: Generate k3s token file on the first node if not exist yet
  delegate_to: "{{ k3s_primary }}"
  when: not k3s_token_file_stat.stat.exists
  ansible.builtin.copy:
    content: "{{ lookup('community.general.random_string', length=32) }}"
    dest: "{{ k3s_token_file }}"
    mode: 0600

- name: Get k3s token from the first node
  delegate_to: "{{ k3s_primary }}"
  ansible.builtin.slurp:
    src: "{{ k3s_token_file }}"
  register: k3s_token_base64

- name: Ensure all nodes has the same token
  ansible.builtin.copy:
    content: "{{ k3s_token_base64.content | b64decode }}"
    dest: "{{ k3s_token_file }}"
    mode: 0600

- name: Copy k3s config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: 0644
  loop:
    - src: config.yaml.j2
      dest: "{{ k3s_config_file }}"
    - src: k3s.service.j2
      dest: "{{ k3s_service_file }}"
  notify: Restart k3s

- name: Copy kube-vip manifests
  when: "'masters' in group_names"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: 0644
  loop:
    - src: kube-vip.yaml.j2
      dest: "{{ k3s_data_dir }}/agent/pod-manifests/kube-vip.yaml"

- name: Enable k3s service
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
  register: k3s_service
  until: k3s_service is succeeded
  retries: 5

- name: Apply the k3s change before moving to the next node
  ansible.builtin.meta: flush_handlers

- name: Wait for the node to rejoin the cluster
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/k3s kubectl wait --for=condition=Ready
      node/{{ inventory_hostname }} --timeout=300s
  delegate_to: "{{ k3s_primary }}"
  changed_when: false

# `state: started` above is satisfied by the old process still holding the
# socket, so it cannot prove the new binary is live. Assert on the version the
# kubelet registers, which is the only thing that fails when a restart is missed.
- name: Verify the node registered the expected k3s version
  ansible.builtin.command:
    cmd: >
      /usr/local/bin/k3s kubectl get node {{ inventory_hostname }}
      -o jsonpath={.status.nodeInfo.kubeletVersion}
  delegate_to: "{{ k3s_primary }}"
  changed_when: false
  register: k3s_node_version
  until: k3s_node_version.stdout == k3s_version
  retries: 30
  delay: 10

- name: Get Kubernetes config file
  delegate_to: "{{ k3s_primary }}"
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_file }}"
  register: kubeconfig_base64

- name: Write Kubernetes config file with the correct cluster address
  ansible.builtin.copy:
    content: "{{ kubeconfig_base64.content | b64decode | replace('127.0.0.1', control_plane_endpoint) }}"
    dest: "{{ playbook_dir }}/kubeconfig.yaml"
    mode: 0600
  delegate_to: localhost
  run_once: true
