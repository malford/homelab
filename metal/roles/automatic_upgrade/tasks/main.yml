- name: Install packages for automatic upgrade
  ansible.builtin.dnf:
    name:
      - dnf-automatic
      - dnf-utils

- name: Copy automatic upgrade config file
  ansible.builtin.copy:
    src: automatic.conf
    dest: /etc/dnf/automatic.conf
    mode: 0644

- name: Create automatic upgrade timer override directory
  ansible.builtin.file:
    path: /etc/systemd/system/dnf-automatic.timer.d
    state: directory
    mode: 0755

- name: Copy automatic upgrade timer override
  ansible.builtin.copy:
    src: dnf-automatic-timer-override.conf
    dest: /etc/systemd/system/dnf-automatic.timer.d/override.conf
    mode: 0644
  notify: Restart dnf-automatic timer

- name: Enable automatic upgrade service
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    state: started
    enabled: true
